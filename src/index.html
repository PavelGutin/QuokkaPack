<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QuokkaPack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Packing lists for every trip. Reusable categories, check items off as you pack. Works offline." />
    <meta name="theme-color" content="#F3EBDD" />
    <script>
      /* Apply the saved or system theme before the app loads, so there is no flash. Mirrors ui/theme.ts. */
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('quokkapack.theme'); } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#161A16' : '#F3EBDD');
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <qp-root></qp-root>
    <noscript>QuokkaPack needs JavaScript.</noscript>
  </body>
</html>
